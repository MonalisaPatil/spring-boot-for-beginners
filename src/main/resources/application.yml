server:
  port : 8080
spring:
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/mydb
    username: root
    password: my-secret-pw
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL5Dialect
    generate-ddl: true
    hibernate.ddl-auto: update



